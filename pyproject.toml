[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelhelm"
version = "0.1.2"
description = "Offline-first verified evidence-brief engine for frontend design: the portable research engine plus PixelHelm's design adapter."
readme = { file = "docs/public/PYPI.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rahul Krishna" }]
keywords = [
  "design",
  "frontend",
  "evidence",
  "research",
  "claim-verification",
  "accessibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://gitlab.com/krahul02004/PixelHelm"
Issues = "https://gitlab.com/krahul02004/PixelHelm/-/work_items"
Changelog = "https://gitlab.com/krahul02004/PixelHelm/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
live = ["anthropic"]

[tool.setuptools]
# Exactly one top-level package. The engine is mapped verbatim from the
# generated Full edition (its internal imports are already relative); the
# adapter is the packaging mirror with engine imports relativized.
packages = ["pixelhelm", "pixelhelm.design_adapter", "pixelhelm.storm_engine"]

[tool.setuptools.package-dir]
pixelhelm = "packaging/pixelhelm"
"pixelhelm.storm_engine" = "plugins/pixelhelm-full/skills/pixelhelm-evidence-brief/storm/storm_engine"
